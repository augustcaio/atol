[package]
name = "atol-dock"
version = "0.1.0"
edition = "2024"
description = "Dock do Atol para o GNOME 51+"
license = "GPL-3.0-or-later"
repository = "https://github.com/augustcaio/atol"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita" }
gio-unix = "0.22"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"] }

[profile.release]
lto = true
strip = true
